<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Nhà sách Sông Hương</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
{% block body %}
<nav class="navbar navbar-expand navbar-dark shop-nav">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('shop.book_list') }}">📖 Nhà sách Sông Hương</a>
    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('shop.book_list') }}">Sách</a></li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('shop.cart') }}">🛒 Giỏ hàng
          <span class="badge rounded-pill cart-badge">{{ cart_count }}</span></a>
      </li>
    </ul>
  </div>
</nav>
<main class="container py-4">
  {% include "_flashes.html" %}
  {% block content %}{% endblock %}
</main>
<footer class="container py-3 text-muted small">
  Phần mềm mã nguồn mở · Bài tập tổng hợp Chương 5–6 ·
  <a href="{{ url_for('admin.dashboard') }}" class="text-muted">Quản trị</a>
</footer>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
